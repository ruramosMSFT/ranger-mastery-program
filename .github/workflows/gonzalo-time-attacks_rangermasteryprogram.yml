# Deploys the static Ranger Mastery Program site to Azure Web App
name: Deploy static site to Azure Web App - RangerMasteryProgram

on:
  push:
    branches:
      - 'gonzalo-time-attacks'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a ./ "$RUNNER_TEMP/site/" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.gitignore' \
            --exclude='preview.cjs'
          echo "Files to deploy:" && ls -la "$RUNNER_TEMP/site"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
          include-hidden-files: false

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_162FD9B2D5F74989B348A9F6C59F54BB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CB580F5468154807BCA63AD87B54CB3B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3780EBFF2BFE4157B1C40C714E7BFD85 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'RangerMasteryProgram'
          slot-name: 'Production'   # change to 'staging' if you add a staging slot
          package: site
