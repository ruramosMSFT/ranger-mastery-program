# Deploys the static Ranger Mastery Program site to Azure Web App
name: Deploy static site to Azure Web App - RangerMasteryProgram

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a ./ "$RUNNER_TEMP/site/" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.gitignore' \
            --exclude='preview.cjs'
          echo "Files to deploy:" && ls -la "$RUNNER_TEMP/site"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
          include-hidden-files: false

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_16204C9619104D0CAF109D7B5171DD88 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E21F4693D2E24D42B5E09E0ACA232775 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_34E45BAA2444413981625AFCF525407F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'RangerMasteryProgram'
          slot-name: 'Production'
          package: site
